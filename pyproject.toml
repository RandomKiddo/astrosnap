[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrosnap"
version = "0.1.0a1"
description = "Research script tools and helper functions for galaxy simulation analysis."
readme = "README.md"
authors = [
    { name = "Neil Ghugare", email = "nghugare2@outlook.com" }
]
license = { text = "BSD-3-Clause" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "astropy",
    "h5py",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/RandomKiddo/astrosnap"
